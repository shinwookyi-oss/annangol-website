<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아난골 디스플레이</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --red:#d7262c; --ink:#14110f; --cream:#f6efe4; --gold:#e0b354; --muted:#a79d90; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; color:var(--cream);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  body.playing { cursor:none; }

  /* ---------- stage ---------- */
  #stage { position:fixed; inset:0; background:#000; }
  body.bar-on #stage { bottom:6vh; }
  .layer { position:absolute; inset:0; opacity:0; transition:opacity .8s ease; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .layer.on { opacity:1; }
  .layer img, .layer video { width:100%; height:100%; object-fit:contain; background:#000; }
  .layer .yt, .layer .yt iframe { width:100%; height:100%; border:0; pointer-events:none; }

  /* ---------- built-in slides ---------- */
  .slide { width:100%; height:100%; padding:6vh 6vw; display:flex; gap:5vw; align-items:center;
    background:radial-gradient(120% 120% at 15% 10%, #3a2418 0%, var(--ink) 60%); }
  .kj { font-weight:900; font-size:9vh; letter-spacing:-.02em; line-height:1; }
  .kj .k { color:var(--red); }
  .m-left { flex:1.3; min-width:0; }
  .m-day { margin-top:4vh; font-size:3.4vh; color:var(--gold); font-weight:700; letter-spacing:.08em; }
  .m-dish { margin-top:1.5vh; font-size:11vh; font-weight:900; line-height:1.1; word-break:keep-all; }
  .m-sub { margin-top:2.5vh; font-size:3.2vh; color:var(--muted); }
  .m-price { margin-top:4vh; display:inline-block; background:var(--red); color:#fff; font-weight:900;
    font-size:8vh; padding:.6vh 2.4vw; border-radius:1.2vh; }
  .m-tag { margin-top:4vh; font-size:3.2vh; color:var(--cream); opacity:.85; }
  .m-week { flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:2vh; padding:3vh 2.5vw; }
  .m-week h3 { font-size:2.6vh; color:var(--gold); letter-spacing:.15em; margin-bottom:2vh; }
  .m-week .row { display:flex; gap:1.5vw; font-size:3.3vh; padding:1.3vh 1vw; border-radius:1vh; }
  .m-week .row .d { width:3.2em; color:var(--muted); font-weight:700; }
  .m-week .row.today { background:var(--red); color:#fff; font-weight:700; }
  .m-week .row.today .d { color:#fff; }
  .slide.text { flex-direction:column; justify-content:center; text-align:center; gap:4vh; }
  .t-title { font-size:11vh; font-weight:900; line-height:1.15; word-break:keep-all; }
  .t-body { font-size:4.6vh; line-height:1.6; color:var(--cream); white-space:pre-line; word-break:keep-all; }
  .t-rule { width:12vw; height:.7vh; background:var(--red); border-radius:1vh; }

  /* ---------- bottom bar ---------- */
  #bar { position:fixed; left:0; right:0; bottom:0; height:6vh; background:var(--ink); display:none;
    align-items:center; justify-content:space-between; padding:0 2.5vw; font-size:2.6vh;
    border-top:.4vh solid var(--red); }
  body.bar-on #bar { display:flex; }
  #bar b { font-weight:900; }
  #bar .mid { color:var(--muted); }
  #clock { font-variant-numeric:tabular-nums; font-weight:700; }

  /* ---------- start overlay ---------- */
  #start { position:fixed; inset:0; z-index:30; background:var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:3vh; text-align:center; padding:4vw; }
  #start h1 { font-size:8vh; font-weight:900; }
  #start h1 span { color:var(--red); }
  #start p { font-size:3vh; color:var(--muted); }
  #start .btns { display:flex; gap:2vw; margin-top:2vh; }
  .big { font:inherit; font-size:3.4vh; font-weight:700; padding:2vh 4vw; border-radius:1.4vh; border:0; cursor:pointer; }
  .big.go { background:var(--red); color:#fff; }
  .big.alt { background:transparent; color:var(--cream); border:2px solid var(--muted); }
  .hidden { display:none !important; }

  #corner { position:fixed; top:0; right:0; width:12vw; height:12vh; z-index:20; }

  /* ---------- admin ---------- */
  #admin { position:fixed; inset:0; z-index:40; background:#f4f1ec; color:#1b1815; overflow-y:auto;
    font-size:16px; cursor:auto; }
  #admin .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 120px; }
  #admin h1 { font-size:26px; margin-bottom:4px; }
  #admin h2 { font-size:19px; margin:30px 0 10px; padding-top:18px; border-top:1px solid #d9d2c6; }
  #admin p.help { color:#6b6359; font-size:14px; line-height:1.5; margin-bottom:10px; }
  #admin input[type=text], #admin input[type=number], #admin input[type=time], #admin textarea {
    font:inherit; padding:9px 10px; border:1px solid #c9c1b4; border-radius:8px; background:#fff; width:100%; }
  #admin textarea { min-height:70px; resize:vertical; }
  #admin button { font:inherit; padding:9px 14px; border-radius:8px; border:1px solid #c9c1b4; background:#fff; cursor:pointer; }
  #admin button.primary { background:var(--red); color:#fff; border-color:var(--red); font-weight:700; }
  #admin button.danger { color:#b3261e; }
  .addrow { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .card { background:#fff; border:1px solid #d9d2c6; border-radius:12px; padding:14px; margin-bottom:10px; }
  .card.off { opacity:.55; }
  .card .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .badge { font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:#1b1815; color:#fff; }
  .badge.youtube { background:#c4302b; } .badge.image { background:#2f6f4f; }
  .badge.video { background:#2b5fa8; } .badge.menu { background:#b8860b; } .badge.text { background:#5d4a8a; }
  .card .head .sp { flex:1; }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:10px; }
  .grid label { font-size:13px; color:#6b6359; display:flex; flex-direction:column; gap:4px; }
  .c12 { grid-column:span 12; } .c6 { grid-column:span 6; } .c4 { grid-column:span 4; } .c3 { grid-column:span 3; }
  @media (max-width:700px) { .c6,.c4,.c3 { grid-column:span 12; } }
  .note { font-size:13px; color:#6b6359; }
  .warn { font-size:13px; color:#b3261e; }
  .week { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  @media (max-width:800px) { .week { grid-template-columns:repeat(2,1fr); } }
  .chk { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .chk input { width:20px; height:20px; }
  #savebar { position:fixed; left:0; right:0; bottom:0; background:#1b1815; padding:12px 20px; display:flex;
    gap:10px; justify-content:flex-end; align-items:center; z-index:41; }
  #savebar span { color:#d9d2c6; font-size:14px; margin-right:auto; }
  #savebar button { font:inherit; font-size:17px; padding:11px 22px; border-radius:8px; border:0; cursor:pointer; }
  #savebar .primary { background:var(--red); color:#fff; font-weight:700; }
</style>
</head>
<body>

<div id="stage"></div>

<div id="bar">
  <div><b>AnnanGol 아난골</b></div>
  <div class="mid" id="barText"></div>
  <div id="clock"></div>
</div>

<div id="corner" title=""></div>

<div id="start">
  <h1>AnnanGol <span>Display</span></h1>
  <p>화면을 터치하면 전체화면으로 시작합니다.<br><span id="countdown"></span></p>
  <div class="btns">
    <button class="big go" id="btnStart">▶ 시작</button>
    <button class="big alt" id="btnSettings">⚙ 설정</button>
  </div>
  <p style="font-size:2.2vh">재생 중 설정 열기: 화면 오른쪽 위 모서리를 빠르게 3번 터치 (키보드는 S)</p>
</div>

<div id="admin" class="hidden"></div>

<script>
/* =====================================================================
   아난골 디스플레이 — 유튜브 / 이미지 / 동영상 / 메뉴 슬라이드 순환 재생
   유튜브 재생을 위해 반드시 웹 주소(https://...)로 열어야 합니다.
   ===================================================================== */
(function () {
  'use strict';

  var LS_KEY = 'annangol-display-v1';
  var DAYS_KO = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  var DAYS_EN = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  var TYPE_NAME = { youtube:'유튜브', image:'이미지', video:'동영상 파일', menu:'메뉴 슬라이드', text:'안내 문구' };

  function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function defaults() {
    return {
      settings: { sound: true, showBar: true, barText: 'Open 7 AM – 10 PM Daily · (703) 914-4600' },
      menu: { week: ['', '', '', '', '', '', ''], price: '$13.99', note: '매일 아침 7–10 AM',
              tagline: '한국인의 힘은 든든한 아침 짬밥에서' },
      items: [
        { id: uid(), type: 'menu', label: '오늘의 K-JjamBab', seconds: 15, from: '07:00', to: '10:00', on: true },
        { id: uid(), type: 'text', label: '영업 안내', seconds: 12, from: '', to: '', on: true,
          title: 'AnnanGol 아난골',
          body: '30년 전통\nOpen 7 AM – 10 PM Daily\nK-JjamBab 7–10 AM · Full menu from 10 AM' }
      ]
    };
  }

  function loadState() {
    var d = defaults();
    try {
      var s = JSON.parse(localStorage.getItem(LS_KEY));
      if (s && Array.isArray(s.items)) {
        d.items = s.items;
        if (s.settings) for (var k in s.settings) d.settings[k] = s.settings[k];
        if (s.menu) for (var m in s.menu) d.menu[m] = s.menu[m];
        if (!Array.isArray(d.menu.week) || d.menu.week.length !== 7) d.menu.week = ['', '', '', '', '', '', ''];
      }
    } catch (e) {}
    return d;
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); return true; } catch (e) { return false; }
  }

  var state = loadState();

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 이 기기에 저장하는 파일 (IndexedDB) ---------- */
  var idb = null;
  function openIdb() {
    return new Promise(function (resolve) {
      if (idb) return resolve(idb);
      try {
        var req = indexedDB.open('annangol-display', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('media'); };
        req.onsuccess = function () { idb = req.result; resolve(idb); };
        req.onerror = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
  }
  function idbPut(key, blob) {
    return openIdb().then(function (db) {
      return new Promise(function (resolve) {
        if (!db) return resolve(false);
        var tx = db.transaction('media', 'readwrite');
        tx.objectStore('media').put(blob, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = tx.onabort = function () { resolve(false); };
      });
    });
  }
  function idbGet(key) {
    return openIdb().then(function (db) {
      return new Promise(function (resolve) {
        if (!db) return resolve(null);
        var req = db.transaction('media').objectStore('media').get(key);
        req.onsuccess = function () { resolve(req.result || null); };
        req.onerror = function () { resolve(null); };
      });
    });
  }
  function idbDel(key) {
    return openIdb().then(function (db) {
      if (!db) return;
      try { db.transaction('media', 'readwrite').objectStore('media').delete(key); } catch (e) {}
    });
  }
  /* src 가 "idb:키" 이면 저장된 파일을, 아니면 주소 그대로 돌려줌 */
  function resolveSrc(src) {
    if (src && src.indexOf('idb:') === 0) {
      return idbGet(src.slice(4)).then(function (blob) {
        return blob ? { url: URL.createObjectURL(blob), revoke: true } : null;
      });
    }
    return Promise.resolve(src ? { url: src, revoke: false } : null);
  }

  /* ---------- 유튜브 ---------- */
  function ytId(input) {
    var s = String(input || '').trim();
    if (/^[\w-]{11}$/.test(s)) return s;
    var m = s.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
    return m ? m[1] : '';
  }
  var ytReady = null;
  function loadYt() {
    if (ytReady) return ytReady;
    ytReady = new Promise(function (resolve) {
      if (window.YT && window.YT.Player) return resolve(true);
      var done = false;
      window.onYouTubeIframeAPIReady = function () { done = true; resolve(true); };
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      s.onerror = function () { if (!done) { ytReady = null; resolve(false); } };
      document.head.appendChild(s);
      setTimeout(function () { if (!done) { ytReady = null; resolve(false); } }, 12000);
    });
    return ytReady;
  }

  /* ---------- 시간대 ---------- */
  function mins(hhmm) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }
  function inWindow(item, now) {
    var a = mins(item.from), b = mins(item.to);
    if (a === null || b === null || a === b) return true;
    var t = now.getHours() * 60 + now.getMinutes();
    return a < b ? (t >= a && t < b) : (t >= a || t < b);   // 자정을 넘기는 시간대도 허용
  }
  function playable(item) {
    if (!item.on) return false;
    if (item.type === 'youtube') return !!ytId(item.src);
    if (item.type === 'image' || item.type === 'video') return !!item.src;
    return true;
  }
  function eligible() {
    var now = new Date();
    return state.items.filter(function (i) { return playable(i) && inWindow(i, now); });
  }

  /* ---------- 재생 ---------- */
  var stage = document.getElementById('stage');
  var token = 0, timer = null, currentId = null, running = false, bootedAt = Date.now();

  function clearLayer(el) {
    if (!el) return;
    if (el._cleanup) { try { el._cleanup(); } catch (e) {} el._cleanup = null; }
    if (el.parentNode) el.parentNode.removeChild(el);
  }
  function swapIn(el) {
    var old = Array.prototype.slice.call(stage.children);
    stage.appendChild(el);
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('on'); }); });
    old.forEach(function (o) { o.classList.remove('on'); setTimeout(function () { clearLayer(o); }, 900); });
  }
  function stopAll() {
    token++; clearTimeout(timer); running = false;
    Array.prototype.slice.call(stage.children).forEach(clearLayer);
    document.body.classList.remove('playing');
  }
  function after(ms, my) {
    clearTimeout(timer);
    timer = setTimeout(function () { if (my === token) next(); }, ms);
  }

  function next() {
    if (!running) return;
    // 하루 이상 켜져 있었으면 새벽 3~5시 사이에 한 번 새로고침
    var h = new Date().getHours();
    if (Date.now() - bootedAt > 20 * 3600 * 1000 && h >= 3 && h < 5) { location.reload(); return; }

    var my = ++token;
    clearTimeout(timer);
    var list = eligible();
    if (!list.length) { showIdle(); after(30000, my); return; }
    var pos = -1;
    for (var i = 0; i < list.length; i++) if (list[i].id === currentId) pos = i;
    var item = list[(pos + 1) % list.length];
    currentId = item.id;
    try { show(item, my); } catch (e) { after(1500, my); }
  }

  function layer() { var d = document.createElement('div'); d.className = 'layer'; return d; }
  function secs(item, fallback) { var n = parseFloat(item.seconds); return (n > 0 ? n : fallback) * 1000; }

  function showIdle() {
    var el = layer();
    el.innerHTML = '<div class="slide text"><div class="t-title">AnnanGol 아난골</div><div class="t-rule"></div></div>';
    swapIn(el);
  }

  function show(item, my) {
    var el = layer();

    if (item.type === 'menu') {
      el.innerHTML = menuHtml();
      swapIn(el); after(secs(item, 15), my); return;
    }
    if (item.type === 'text') {
      el.innerHTML = '<div class="slide text"><div class="t-title">' + esc(item.title) + '</div>' +
        '<div class="t-rule"></div><div class="t-body">' + esc(item.body) + '</div></div>';
      swapIn(el); after(secs(item, 12), my); return;
    }

    if (item.type === 'image') {
      resolveSrc(item.src).then(function (r) {
        if (my !== token) { if (r && r.revoke) URL.revokeObjectURL(r.url); return; }
        if (!r) { after(500, my); return; }
        var img = new Image();
        if (r.revoke) el._cleanup = function () { URL.revokeObjectURL(r.url); };
        img.onload = function () { if (my !== token) return; el.appendChild(img); swapIn(el); after(secs(item, 10), my); };
        img.onerror = function () { if (my !== token) return; clearLayer(el); after(500, my); };
        img.src = r.url;
      });
      after(15000, my);   // 이미지가 끝내 안 열리면 다음으로
      return;
    }

    if (item.type === 'video') {
      resolveSrc(item.src).then(function (r) {
        if (my !== token) { if (r && r.revoke) URL.revokeObjectURL(r.url); return; }
        if (!r) { after(500, my); return; }
        var v = document.createElement('video');
        v.playsInline = true; v.preload = 'auto'; v.muted = !state.settings.sound;
        el._cleanup = function () { try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {} if (r.revoke) URL.revokeObjectURL(r.url); };
        v.onended = function () { if (my === token) next(); };
        v.onerror = function () { if (my === token) after(500, my); };
        v.onplaying = function () { clearTimeout(timer); };
        v.src = r.url;
        el.appendChild(v); swapIn(el);
        var p = v.play();
        if (p && p.catch) p.catch(function () { v.muted = true; var q = v.play(); if (q && q.catch) q.catch(function () { if (my === token) after(500, my); }); });
      });
      after(20000, my);   // 20초 안에 재생이 시작되지 않으면 다음으로
      return;
    }

    if (item.type === 'youtube') {
      var id = ytId(item.src);
      var holder = document.createElement('div'); holder.className = 'yt';
      var target = document.createElement('div'); holder.appendChild(target);
      el.appendChild(holder); swapIn(el);
      after(25000, my);   // 25초 안에 재생이 시작되지 않으면 다음으로
      loadYt().then(function (ok) {
        if (my !== token) return;
        if (!ok) { after(500, my); return; }
        var started = false, player;
        player = new YT.Player(target, {
          width: '100%', height: '100%', videoId: id,
          playerVars: { autoplay: 1, controls: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3,
                        disablekb: 1, fs: 0, mute: state.settings.sound ? 0 : 1, origin: location.origin },
          events: {
            onReady: function (e) {
              if (my !== token) return;
              if (!state.settings.sound) e.target.mute();
              e.target.playVideo();
              // 소리 있는 자동재생이 막히면 음소거로 다시 시도
              setTimeout(function () {
                if (my === token && !started) { try { e.target.mute(); e.target.playVideo(); } catch (x) {} }
              }, 6000);
            },
            onStateChange: function (e) {
              if (my !== token) return;
              if (e.data === 1) { started = true; clearTimeout(timer); }
              if (e.data === 0) next();
            },
            onError: function () { if (my === token) after(500, my); }
          }
        });
        el._cleanup = function () { try { player.destroy(); } catch (e) {} };
      });
      return;
    }

    after(500, my);
  }

  function menuHtml() {
    var m = state.menu, d = new Date().getDay();
    var dish = (m.week[d] || '').trim();
    var any = m.week.some(function (w) { return (w || '').trim(); });
    var html = '<div class="slide menu"><div class="m-left">' +
      '<div class="kj"><span class="k">K</span>-JjamBab</div>' +
      '<div class="m-day">' + DAYS_KO[d] + ' · ' + DAYS_EN[d] + '</div>' +
      '<div class="m-dish">' + esc(dish || '오늘의 백반') + '</div>' +
      (m.note ? '<div class="m-sub">' + esc(m.note) + '</div>' : '') +
      (m.price ? '<div class="m-price">' + esc(m.price) + '</div>' : '') +
      (m.tagline ? '<div class="m-tag">' + esc(m.tagline) + '</div>' : '') + '</div>';
    if (any) {
      html += '<div class="m-week"><h3>WEEKLY MENU</h3>';
      for (var i = 1; i <= 7; i++) {
        var k = i % 7;   // 월요일부터
        html += '<div class="row' + (k === d ? ' today' : '') + '"><span class="d">' + DAYS_KO[k].slice(0, 1) +
          '</span><span>' + esc((m.week[k] || '').trim() || '—') + '</span></div>';
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  /* ---------- 하단 바 / 시계 ---------- */
  function applyChrome() {
    document.body.classList.toggle('bar-on', !!state.settings.showBar);
    document.getElementById('barText').textContent = state.settings.barText || '';
  }
  function tick() {
    var n = new Date(), h = n.getHours(), m = n.getMinutes();
    document.getElementById('clock').textContent =
      (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  setInterval(tick, 10000); tick(); applyChrome();

  /* ---------- 시작 ---------- */
  var startEl = document.getElementById('start');
  var countdownEl = document.getElementById('countdown');
  var autoTimer = null, left = 10;

  function begin(viaTouch) {
    clearInterval(autoTimer);
    startEl.classList.add('hidden');
    if (viaTouch) {
      try { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {}
    document.body.classList.add('playing');
    running = true; currentId = null; next();
  }
  document.getElementById('btnStart').addEventListener('click', function () { begin(true); });
  document.getElementById('btnSettings').addEventListener('click', function () { clearInterval(autoTimer); countdownEl.textContent = ''; openAdmin(); });
  autoTimer = setInterval(function () {
    left--; countdownEl.textContent = left + '초 후 자동으로 시작합니다.';
    if (left <= 0) begin(false);
  }, 1000);
  countdownEl.textContent = left + '초 후 자동으로 시작합니다.';

  /* 재생 중 설정 열기: 오른쪽 위 모서리 3번 터치, 또는 S 키 */
  var taps = [];
  document.getElementById('corner').addEventListener('click', function () {
    var t = Date.now(); taps = taps.filter(function (x) { return t - x < 2000; }); taps.push(t);
    if (taps.length >= 3) { taps = []; openAdmin(); }
  });
  document.addEventListener('keydown', function (e) {
    if (!adminEl.classList.contains('hidden')) return;
    if (e.key === 's' || e.key === 'S') openAdmin();
  });

  /* ---------- 설정 화면 ---------- */
  var adminEl = document.getElementById('admin');
  var isWeb = /^https?:$/.test(location.protocol);

  function openAdmin() {
    clearInterval(autoTimer);
    stopAll();
    startEl.classList.add('hidden');
    adminEl.classList.remove('hidden');
    renderAdmin();
  }
  function closeAdmin() {
    saveState(); applyChrome();
    adminEl.classList.add('hidden');
    startEl.classList.remove('hidden');
    countdownEl.textContent = '';
  }

  function itemCard(it, i) {
    var h = '<div class="card' + (it.on ? '' : ' off') + '" data-i="' + i + '"><div class="head">' +
      '<span class="badge ' + it.type + '">' + TYPE_NAME[it.type] + '</span>' +
      '<b>' + (i + 1) + '. ' + esc(it.label || '') + '</b><span class="sp"></span>' +
      '<button data-act="up">▲</button><button data-act="down">▼</button>' +
      '<button data-act="toggle">' + (it.on ? '끄기' : '켜기') + '</button>' +
      '<button class="danger" data-act="del">삭제</button></div><div class="grid">';
    h += '<label class="c6">이름 (목록 표시용)<input type="text" data-f="label" value="' + esc(it.label) + '"></label>';
    if (it.type === 'youtube') {
      h += '<label class="c6">유튜브 주소<input type="text" data-f="src" placeholder="https://www.youtube.com/watch?v=..." value="' + esc(it.src) + '"></label>';
      if (it.src && !ytId(it.src)) h += '<div class="c12 warn">유튜브 주소를 인식하지 못했습니다. 영상 한 개의 주소를 넣어 주세요.</div>';
    } else if (it.type === 'image' || it.type === 'video') {
      var stored = it.src && it.src.indexOf('idb:') === 0;
      h += '<label class="c6">파일 주소 (웹에 올린 파일)<input type="text" data-f="src" placeholder="media/ad1.jpg 또는 https://..." value="' + esc(stored ? '' : it.src) + '"></label>';
      h += '<label class="c6">또는 이 기기에서 파일 선택<input type="file" data-file accept="' + (it.type === 'image' ? 'image/*' : 'video/*') + '"></label>';
      if (stored) h += '<div class="c12 note">이 기기에 저장된 파일 사용 중: ' + esc(it.fileName || '') + '</div>';
    } else if (it.type === 'text') {
      h += '<label class="c6">큰 제목<input type="text" data-f="title" value="' + esc(it.title) + '"></label>';
      h += '<label class="c12">내용 (줄바꿈 가능)<textarea data-f="body">' + esc(it.body) + '</textarea></label>';
    } else if (it.type === 'menu') {
      h += '<div class="c6 note">아래 "요일별 K-JjamBab 메뉴"에서 입력한 내용 중 오늘 요일의 메뉴를 보여줍니다.</div>';
    }
    if (it.type === 'youtube' || it.type === 'video') {
      h += '<div class="c4 note">영상은 끝까지 재생한 뒤 다음으로 넘어갑니다.</div>';
    } else {
      h += '<label class="c4">표시 시간 (초)<input type="number" min="3" data-f="seconds" value="' + esc(it.seconds) + '"></label>';
    }
    h += '<label class="c4">시작 시각 (비우면 종일)<input type="time" data-f="from" value="' + esc(it.from) + '"></label>';
    h += '<label class="c4">종료 시각<input type="time" data-f="to" value="' + esc(it.to) + '"></label>';
    return h + '</div></div>';
  }

  function renderAdmin() {
    var s = state.settings, m = state.menu, n = eligible().length;
    var h = '<div class="wrap"><h1>아난골 디스플레이 설정</h1>' +
      '<p class="help">위에서 아래 순서대로 반복 재생됩니다. 시작·종료 시각을 넣으면 그 시간대에만 나옵니다. 설정은 이 기기의 브라우저에 저장됩니다.</p>';
    if (!isWeb) h += '<p class="warn">지금은 파일로 직접 연 상태입니다. 유튜브 영상은 웹 주소(https://...)로 열었을 때만 재생됩니다.</p>';

    h += '<h2>재생 목록</h2><div class="addrow">' +
      '<button data-add="youtube">+ 유튜브 영상</button><button data-add="image">+ 이미지 (광고)</button>' +
      '<button data-add="video">+ 동영상 파일</button><button data-add="menu">+ 메뉴 슬라이드</button>' +
      '<button data-add="text">+ 안내 문구</button></div><div id="items">';
    state.items.forEach(function (it, i) { h += itemCard(it, i); });
    h += '</div><p class="note">지금 시간대에 재생되는 항목: ' + n + '개</p>';

    h += '<h2>요일별 K-JjamBab 메뉴</h2><p class="help">메뉴 슬라이드에 오늘의 메인 메뉴로 표시됩니다. 비워 두면 "오늘의 백반"으로 나옵니다.</p><div class="week">';
    for (var i = 1; i <= 7; i++) { var k = i % 7;
      h += '<label class="note">' + DAYS_KO[k] + '<input type="text" data-week="' + k + '" value="' + esc(m.week[k]) + '"></label>'; }
    h += '</div><div class="grid" style="margin-top:12px">' +
      '<label class="c3">가격<input type="text" data-menu="price" value="' + esc(m.price) + '"></label>' +
      '<label class="c4">안내 한 줄<input type="text" data-menu="note" value="' + esc(m.note) + '"></label>' +
      '<label class="c4" style="grid-column:span 5">문구<input type="text" data-menu="tagline" value="' + esc(m.tagline) + '"></label></div>';

    h += '<h2>화면 설정</h2>' +
      '<label class="chk"><input type="checkbox" data-set="sound"' + (s.sound ? ' checked' : '') + '> 영상 소리 켜기</label>' +
      '<label class="chk"><input type="checkbox" data-set="showBar"' + (s.showBar ? ' checked' : '') + '> 하단 바 (매장명 · 안내 · 시계) 표시</label>' +
      '<div class="grid"><label class="c12">하단 바 안내 문구<input type="text" data-set="barText" value="' + esc(s.barText) + '"></label></div>';

    h += '<h2>백업 / 다른 기기로 옮기기</h2><p class="help">아래 글자를 복사해 두면 설정을 백업할 수 있습니다. 다른 기기에서는 붙여넣고 "불러오기"를 누르세요. (이 기기에서 선택한 파일은 옮겨지지 않습니다.)</p>' +
      '<textarea id="backup" style="min-height:110px;font-family:monospace;font-size:13px">' + esc(JSON.stringify(state)) + '</textarea>' +
      '<div class="addrow"><button id="btnImport">불러오기</button><button class="danger" id="btnReset">처음 상태로 되돌리기</button><span class="note" id="backupMsg"></span></div>';

    h += '</div><div id="savebar"><span>변경 내용은 자동 저장됩니다.</span><button class="primary" id="btnDone">저장하고 닫기</button></div>';
    adminEl.innerHTML = h;
  }

  function newItem(type) {
    var it = { id: uid(), type: type, label: TYPE_NAME[type], from: '', to: '', on: true };
    if (type === 'youtube' || type === 'image' || type === 'video') it.src = '';
    if (type === 'image') it.seconds = 10;
    if (type === 'menu') { it.seconds = 15; it.label = '오늘의 K-JjamBab'; }
    if (type === 'text') { it.seconds = 12; it.title = '제목'; it.body = '내용을 입력하세요'; }
    return it;
  }

  adminEl.addEventListener('click', function (e) {
    var t = e.target;
    if (t.dataset.add) { state.items.push(newItem(t.dataset.add)); saveState(); renderAdmin(); return; }
    if (t.dataset.act) {
      var i = +t.closest('.card').dataset.i, it = state.items[i], a = t.dataset.act;
      if (a === 'up' && i > 0) { state.items.splice(i - 1, 0, state.items.splice(i, 1)[0]); }
      if (a === 'down' && i < state.items.length - 1) { state.items.splice(i + 1, 0, state.items.splice(i, 1)[0]); }
      if (a === 'toggle') it.on = !it.on;
      if (a === 'del') {
        if (t.dataset.sure) {
          if (it.src && it.src.indexOf('idb:') === 0) idbDel(it.src.slice(4));
          state.items.splice(i, 1);
        } else { t.dataset.sure = '1'; t.textContent = '한 번 더 누르면 삭제'; return; }
      }
      saveState(); renderAdmin(); return;
    }
    if (t.id === 'btnDone') { closeAdmin(); return; }
    if (t.id === 'btnImport') {
      var msg = document.getElementById('backupMsg');
      try {
        var s = JSON.parse(document.getElementById('backup').value);
        if (!s || !Array.isArray(s.items)) throw 0;
        localStorage.setItem(LS_KEY, JSON.stringify(s)); state = loadState(); renderAdmin();
      } catch (x) { msg.textContent = '불러오지 못했습니다. 복사한 내용을 다시 확인해 주세요.'; }
      return;
    }
    if (t.id === 'btnReset') {
      if (t.dataset.sure) { try { localStorage.removeItem(LS_KEY); } catch (x) {} state = defaults(); saveState(); renderAdmin(); }
      else { t.dataset.sure = '1'; t.textContent = '한 번 더 누르면 모두 지웁니다'; }
    }
  });

  adminEl.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.f) {
      var it = state.items[+t.closest('.card').dataset.i];
      if (t.dataset.f === 'src' && it.src && it.src.indexOf('idb:') === 0 && !t.value) return;
      it[t.dataset.f] = t.type === 'number' ? (parseFloat(t.value) || '') : t.value;
    } else if (t.dataset.week) { state.menu.week[+t.dataset.week] = t.value; }
    else if (t.dataset.menu) { state.menu[t.dataset.menu] = t.value; }
    else if (t.dataset.set && t.type !== 'checkbox') { state.settings[t.dataset.set] = t.value; }
    else return;
    saveState();
  });

  adminEl.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.set && t.type === 'checkbox') { state.settings[t.dataset.set] = t.checked; saveState(); return; }
    if (t.hasAttribute('data-file') && t.files && t.files[0]) {
      var it = state.items[+t.closest('.card').dataset.i], f = t.files[0], key = it.id;
      idbPut(key, f).then(function (ok) {
        if (ok) { it.src = 'idb:' + key; it.fileName = f.name; if (!it.label || it.label === TYPE_NAME[it.type]) it.label = f.name; saveState(); }
        renderAdmin();
        if (!ok) { var c = adminEl.querySelector('.card[data-i="' + state.items.indexOf(it) + '"] .grid');
          if (c) c.insertAdjacentHTML('beforeend', '<div class="c12 warn">이 기기에 파일을 저장하지 못했습니다. 파일을 웹에 올리고 주소를 넣어 주세요.</div>'); }
      });
    }
  });
})();
</script>
</body>
</html>
