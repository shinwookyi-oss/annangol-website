<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아난골 디스플레이</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --red:#d7262c; --ink:#14110f; --cream:#f6efe4; --gold:#e0b354; --muted:#a79d90; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  #root { position:fixed; left:0; top:0; transform-origin:top left; overflow:hidden; background:#000; color:var(--cream);
    --u:10px; font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
  #root.playing { cursor:none; }
  .hidden { display:none !important; }

  /* ---------- stage ---------- */
  #stage { position:absolute; top:0; right:0; bottom:0; left:0; background:#000; }
  #root.bar-on #stage { bottom:calc(6 * var(--u)); }
  .layer { position:absolute; top:0; right:0; bottom:0; left:0; opacity:0; transition:opacity .8s ease; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .layer.on { opacity:1; }
  .layer img, .layer video { width:100%; height:100%; object-fit:contain; background:#000; }
  .layer .yt, .layer .yt iframe { width:100%; height:100%; border:0; pointer-events:none; }

  /* ---------- built-in slides ---------- */
  .slide { width:100%; height:100%; padding:calc(6 * var(--u)); display:flex; gap:calc(5 * var(--u)); align-items:center;
    background:radial-gradient(120% 120% at 15% 10%, #3a2418 0%, var(--ink) 60%); }
  .portrait .slide { flex-direction:column; justify-content:center; align-items:stretch; }
  .kj { font-weight:900; font-size:calc(9 * var(--u)); letter-spacing:-.02em; line-height:1; }
  .kj .k { color:var(--red); }
  .m-left { flex:1.3; min-width:0; }
  .portrait .m-left { flex:none; }
  .m-day { margin-top:calc(4 * var(--u)); font-size:calc(3.4 * var(--u)); color:var(--gold); font-weight:700; letter-spacing:.08em; }
  .m-dish { margin-top:calc(1.5 * var(--u)); font-size:calc(11 * var(--u)); font-weight:900; line-height:1.1; word-break:keep-all; }
  .m-extra { margin-top:calc(2 * var(--u)); font-size:calc(3.6 * var(--u)); line-height:1.5; word-break:keep-all; }
  .m-extra b { color:var(--gold); font-weight:700; margin-right:.5em; }
  .m-en { font-size:calc(4 * var(--u)); color:var(--muted); font-weight:700; margin-top:calc(.6 * var(--u)); }
  small.en { display:block; font-size:.62em; font-weight:400; color:var(--muted); line-height:1.3; }
  .w-row.today small.en { color:#ffe1e1; }
  .m-sub { margin-top:calc(2 * var(--u)); font-size:calc(3.2 * var(--u)); color:var(--muted); }
  .m-price { margin-top:calc(3.5 * var(--u)); display:inline-block; background:var(--red); color:#fff; font-weight:900;
    font-size:calc(8 * var(--u)); padding:calc(.6 * var(--u)) calc(3 * var(--u)); border-radius:calc(1.2 * var(--u)); }
  .m-was { font-size:calc(4 * var(--u)); color:var(--muted); text-decoration:line-through; font-weight:700; margin-left:calc(2 * var(--u)); vertical-align:middle; }
  .m-deal { margin-top:calc(3.5 * var(--u)); margin-bottom:calc(-2.5 * var(--u)); font-size:calc(2.8 * var(--u)); font-weight:900; color:var(--gold); letter-spacing:.04em; }
  .w-foot .was { text-decoration:line-through; margin-right:calc(1.5 * var(--u)); }
  .w-foot .deal { color:var(--gold); font-weight:900; margin-right:calc(1.5 * var(--u)); }
  .m-tag { margin-top:calc(3.5 * var(--u)); font-size:calc(3.2 * var(--u)); opacity:.85; }
  .m-week { flex:1; min-width:0; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:calc(2 * var(--u)); padding:calc(3 * var(--u)); }
  .portrait .m-week { flex:none; }
  .m-week h3 { font-size:calc(2.6 * var(--u)); color:var(--gold); letter-spacing:.15em; margin-bottom:calc(2 * var(--u)); }
  .m-week .row { display:flex; gap:calc(2 * var(--u)); font-size:calc(3.3 * var(--u)); padding:calc(1.3 * var(--u)) calc(1.5 * var(--u)); border-radius:calc(1 * var(--u)); }
  .m-week .row .d { width:2.2em; flex:none; color:var(--muted); font-weight:700; }
  .m-week .row.today { background:var(--red); color:#fff; font-weight:700; }
  .m-week .row.today .d { color:#fff; }

  .slide.week { flex-direction:column; align-items:stretch; justify-content:center; gap:calc(3 * var(--u)); }
  .w-head { display:flex; align-items:baseline; justify-content:space-between; gap:calc(3 * var(--u)); flex-wrap:wrap; }
  .w-head .kj { font-size:calc(7 * var(--u)); }
  .w-title { font-size:calc(4.2 * var(--u)); font-weight:900; color:var(--gold); }
  .w-title small { font-size:.7em; color:var(--muted); font-weight:700; margin-left:.6em; }
  .w-rows { display:flex; flex-direction:column; gap:calc(1 * var(--u)); }
  .w-row { display:flex; align-items:center; gap:calc(3 * var(--u)); padding:calc(1.4 * var(--u)) calc(2.5 * var(--u));
    background:rgba(255,255,255,.06); border-radius:calc(1.2 * var(--u)); }
  .w-row .d { width:5.2em; flex:none; font-size:calc(3 * var(--u)); font-weight:700; color:var(--muted); }
  .w-row .mn { font-size:calc(4.4 * var(--u)); font-weight:900; word-break:keep-all; }
  .w-row .ex { font-size:calc(2.5 * var(--u)); color:var(--muted); margin-left:auto; text-align:right; word-break:keep-all; }
  .portrait .w-row { flex-wrap:wrap; gap:calc(.6 * var(--u)) calc(3 * var(--u)); padding:calc(2 * var(--u)) calc(2.5 * var(--u)); }
  .portrait .w-row .ex { margin-left:0; text-align:left; width:100%; padding-left:calc(5.2em * 1.2 + 3 * var(--u)); }
  #root:not(.portrait) .slide.week { padding:calc(4 * var(--u)) calc(6 * var(--u)); gap:calc(2 * var(--u)); }
  #root:not(.portrait) .w-rows { gap:calc(.8 * var(--u)); }
  #root:not(.portrait) .w-row { padding:calc(1.1 * var(--u)) calc(2.5 * var(--u)); }
  #root:not(.portrait) .w-row .mn small.en { display:inline; margin-left:.8em; }
  .w-row.today { background:var(--red); }
  .w-row.today .d, .w-row.today .ex { color:#fff; }
  .w-foot { display:flex; justify-content:space-between; align-items:center; font-size:calc(3 * var(--u)); color:var(--muted); }
  .w-foot .p { background:var(--red); color:#fff; font-weight:900; font-size:calc(4.5 * var(--u)); padding:calc(.4 * var(--u)) calc(2 * var(--u)); border-radius:calc(1 * var(--u)); }

  .slide.text { flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:calc(4 * var(--u)); }
  .t-title { font-size:calc(11 * var(--u)); font-weight:900; line-height:1.15; word-break:keep-all; }
  .t-body { font-size:calc(4.6 * var(--u)); line-height:1.6; white-space:pre-line; word-break:keep-all; }
  .t-rule { width:calc(14 * var(--u)); height:calc(.7 * var(--u)); background:var(--red); border-radius:1em; }

  /* ---------- bottom bar ---------- */
  #bar { position:absolute; left:0; right:0; bottom:0; height:calc(6 * var(--u)); background:var(--ink); display:none;
    align-items:center; justify-content:space-between; gap:calc(2 * var(--u)); padding:0 calc(2.5 * var(--u));
    font-size:calc(2.5 * var(--u)); border-top:calc(.4 * var(--u)) solid var(--red); white-space:nowrap; }
  #root.bar-on #bar { display:flex; }
  #bar b { font-weight:900; }
  #bar .mid { color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
  #clock { font-variant-numeric:tabular-nums; font-weight:700; }

  /* ---------- start overlay ---------- */
  #start { position:absolute; top:0; right:0; bottom:0; left:0; z-index:30; background:var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(2.6 * var(--u)); text-align:center; padding:calc(4 * var(--u)); overflow:auto; }
  #start h1 { font-size:calc(7 * var(--u)); font-weight:900; }
  #start h1 span { color:var(--red); }
  #start p { font-size:calc(2.6 * var(--u)); color:var(--muted); line-height:1.5; }
  #start .btns { display:flex; gap:calc(2 * var(--u)); flex-wrap:wrap; justify-content:center; }
  .big { font:inherit; font-size:calc(3 * var(--u)); font-weight:700; padding:calc(1.8 * var(--u)) calc(3.5 * var(--u));
    border-radius:calc(1.4 * var(--u)); border:2px solid var(--muted); background:transparent; color:var(--cream); cursor:pointer; }
  .big:focus, .seg:focus { outline:calc(.5 * var(--u)) solid var(--gold); outline-offset:calc(.4 * var(--u)); }
  .big.go { background:var(--red); color:#fff; border-color:var(--red); }
  .dev { display:flex; flex-direction:column; gap:calc(1.4 * var(--u)); margin-top:calc(1 * var(--u)); padding:calc(2 * var(--u));
    border:1px solid rgba(255,255,255,.15); border-radius:calc(1.6 * var(--u)); }
  .dev .line { display:flex; align-items:center; gap:calc(1.2 * var(--u)); flex-wrap:wrap; justify-content:center; font-size:calc(2.2 * var(--u)); color:var(--muted); }
  .seg { font:inherit; font-size:calc(2.2 * var(--u)); padding:calc(.9 * var(--u)) calc(1.8 * var(--u)); border-radius:calc(1 * var(--u));
    border:1px solid var(--muted); background:transparent; color:var(--cream); cursor:pointer; }
  .seg.sel { background:var(--cream); color:var(--ink); font-weight:700; }

  #mutebadge { position:absolute; left:calc(2 * var(--u)); top:calc(2 * var(--u)); z-index:25; pointer-events:none; background:rgba(0,0,0,.72);
    color:#fff; font-size:calc(2.4 * var(--u)); padding:calc(1 * var(--u)) calc(2 * var(--u)); border-radius:calc(1 * var(--u)); }
  #corner { position:absolute; top:0; right:0; width:calc(14 * var(--u)); height:calc(14 * var(--u)); z-index:20; }

  /* ---------- whiteboard ---------- */
  #wb { position:absolute; top:0; right:0; bottom:0; left:0; z-index:35; background:#fff; touch-action:none; }
  #wb canvas { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }
  #wbtools { position:absolute; left:50%; bottom:calc(2 * var(--u)); transform:translateX(-50%); display:flex; gap:8px; flex-wrap:wrap;
    justify-content:center; background:#1b1815; padding:10px 12px; border-radius:14px; max-width:96%; }
  #wbtools button { font:inherit; font-size:16px; min-width:44px; height:44px; padding:0 12px; border-radius:10px; border:2px solid transparent;
    background:#3a342e; color:#fff; cursor:pointer; }
  #wbtools button.sel { border-color:#fff; }
  #wbtools .sw { width:44px; padding:0; }

  /* ---------- admin ---------- */
  #admin { position:absolute; top:0; right:0; bottom:0; left:0; z-index:40; background:#f4f1ec; color:#1b1815; overflow-y:auto; font-size:16px; cursor:auto; }
  #admin .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 120px; }
  #admin h1 { font-size:26px; margin-bottom:4px; }
  #admin h2 { font-size:19px; margin:30px 0 10px; padding-top:18px; border-top:1px solid #d9d2c6; }
  #admin p.help { color:#6b6359; font-size:14px; line-height:1.5; margin-bottom:10px; }
  #admin input[type=text], #admin input[type=password], #admin input[type=number], #admin input[type=time], #admin input[type=date], #admin textarea, #admin select {
    font:inherit; padding:9px 10px; border:1px solid #c9c1b4; border-radius:8px; background:#fff; width:100%; color:#1b1815; }
  #admin textarea { min-height:70px; resize:vertical; }
  #admin button { font:inherit; padding:9px 14px; border-radius:8px; border:1px solid #c9c1b4; background:#fff; cursor:pointer; color:#1b1815; }
  #admin button.primary { background:var(--red); color:#fff; border-color:var(--red); font-weight:700; }
  #admin button.danger { color:#b3261e; }
  #admin button.on { background:#1b1815; color:#fff; border-color:#1b1815; }
  .addrow { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; align-items:center; }
  .card { background:#fff; border:1px solid #d9d2c6; border-radius:12px; padding:14px; margin-bottom:10px; }
  .card.off { opacity:.55; }
  .card .head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .badge { font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px; background:#1b1815; color:#fff; }
  .badge.youtube { background:#c4302b; } .badge.image { background:#2f6f4f; }
  .badge.video { background:#2b5fa8; } .badge.menu { background:#b8860b; } .badge.text { background:#5d4a8a; }
  .card .head .sp { flex:1; }
  .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:10px; }
  .grid label { font-size:13px; color:#6b6359; display:flex; flex-direction:column; gap:4px; }
  .c12 { grid-column:span 12; } .c6 { grid-column:span 6; } .c4 { grid-column:span 4; } .c3 { grid-column:span 3; } .c2 { grid-column:span 2; }
  @media (max-width:700px) { .c6,.c4,.c3,.c2 { grid-column:span 12; } }
  .note { font-size:13px; color:#6b6359; }
  .ytrow { display:flex; gap:6px; margin-bottom:6px; }
  .ytrow button { flex:none; }
  .warn { font-size:13px; color:#b3261e; }
  .thumb { max-height:90px; max-width:160px; border-radius:6px; border:1px solid #d9d2c6; display:block; }
  .sched .drow { display:grid; grid-template-columns:90px 1.2fr 1fr 1.6fr; gap:8px; align-items:center; margin-bottom:8px; }
  .sched .drow.en { margin:-4px 0 14px; }
  .sched .drow.en input { font-size:13px; padding:6px 10px; color:#6b6359; }
  .sched .drow.today .dl { color:var(--red); }
  .sched .dl { font-weight:700; font-size:14px; line-height:1.3; }
  .sched .dl small { display:block; font-weight:400; color:#6b6359; }
  .sched .hdr { font-size:12px; color:#6b6359; }
  @media (max-width:700px) { .sched .drow { grid-template-columns:1fr; background:#fff; border:1px solid #d9d2c6; border-radius:10px; padding:10px; }
    .sched .hdr { display:none; } }
  .chk { display:flex; align-items:center; gap:8px; margin:8px 0; }
  .chk input { width:20px; height:20px; }
  #savebar { position:sticky; bottom:0; background:#1b1815; padding:12px 20px; display:flex; gap:10px; justify-content:flex-end;
    align-items:center; z-index:41; margin-top:-64px; }
  #savebar span { color:#d9d2c6; font-size:14px; margin-right:auto; }
  #savebar button { font:inherit; font-size:16px; padding:10px 18px; border-radius:8px; border:0; cursor:pointer; }
  #savebar .primary { background:var(--red); color:#fff; font-weight:700; }
  .login { max-width:380px; margin:12vh auto 0; padding:0 20px; display:flex; flex-direction:column; gap:12px; }
</style>
</head>
<body>
<div id="root">

<div id="stage"></div>

<div id="bar">
  <div><b>AnnanGol 아난골</b></div>
  <div class="mid" id="barText"></div>
  <div id="clock"></div>
</div>

<div id="corner"></div>
<div id="mutebadge" class="hidden">🔇 화면을 터치하거나 리모컨의 확인(OK) 버튼을 누르면 소리가 켜집니다</div>

<div id="start">
  <h1>AnnanGol <span>Display</span></h1>
  <p id="countdown">이 화면에서 무엇을 할지 골라 주세요.</p>
  <div class="btns">
    <button class="big go" data-go="board">▶ 보드로 시작 (세로)</button>
    <button class="big go" data-go="tv">▶ TV로 시작 (가로)</button>
  </div>
  <div class="btns">
    <button class="big" id="btnAdmin">⚙ 관리자 로그인</button>
    <button class="big" id="btnBoard">✎ 화이트보드</button>
  </div>
  <div class="dev">
    <div class="line">화면 회전:
      <button class="seg" data-rot="0">회전 없음</button>
      <button class="seg" data-rot="90">90°</button>
      <button class="seg" data-rot="270">270°</button>
    </div>
  </div>
  <p>재생 중 이 화면으로 돌아오기: 오른쪽 위 모서리를 빠르게 3번 터치 · 리모컨은 위쪽(▲) 버튼을 빠르게 3번 · 키보드는 Esc</p>
</div>

<div id="wb" class="hidden">
  <canvas id="wbc"></canvas>
  <div id="wbtools">
    <button class="sw" data-c="#111111" style="background:#111"></button>
    <button class="sw" data-c="#d7262c" style="background:#d7262c"></button>
    <button class="sw" data-c="#1d5fd0" style="background:#1d5fd0"></button>
    <button class="sw" data-c="#1f8a4c" style="background:#1f8a4c"></button>
    <button data-w="4">가늘게</button>
    <button data-w="10">보통</button>
    <button data-w="22">굵게</button>
    <button data-c="erase">지우개</button>
    <button id="wbUndo">되돌리기</button>
    <button id="wbClear">모두 지우기</button>
    <button id="wbClose" style="background:#d7262c">닫기</button>
  </div>
</div>

<div id="admin" class="hidden"></div>

</div>
<script>
/* =====================================================================
   아난골 디스플레이
   - 재생 화면: 유튜브(영상·재생목록) / 이미지 / 동영상 / 짬밥 메뉴 / 안내 문구 순환
   - 관리자: 같은 주소에서 로그인해 목록·업로드·주간 스케줄 수정 (서버에 저장)
   - 화면 종류: 보드(세로) / TV(가로) — 항목마다 어느 화면에 낼지 선택
   ===================================================================== */
(function () {
  'use strict';

  var API = 'api.php';
  var CACHE_KEY = 'annangol-display-state', DEV_KEY = 'annangol-display-device';
  var DAY_KO = ['일', '월', '화', '수', '목', '금', '토'];
  var DAY_EN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  var BUILTIN = [   // 사이트에 미리 올려 둔 포스터: [주소, 이름, 나올 화면]
    ['media/kjjambab-special.jpg', 'K-JjamBab 특가 포스터 (세로)', 'board'], ['media/hero-price.jpg', 'HERO PRICE 포스터 (세로)', 'board'],
    ['media/dosirock-portrait.jpg', 'K-DosiRock Coming Soon (세로)', 'board'], ['media/dosirock-landscape.jpg', 'K-DosiRock Coming Soon (가로)', 'tv'],
    ['media/annangol-portrait.jpg', '아난골 포스터 (세로)', 'board'], ['media/annangol-landscape.jpg', '아난골 포스터 (가로)', 'tv']
  ];
  var TYPE_NAME = { youtube: '유튜브', image: '이미지', video: '동영상 파일', menu: '짬밥 메뉴', text: '안내 문구' };
  var root = document.getElementById('root');

  function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 날짜 ---------- */
  function ymd(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }

  /* ---------- 상태 ---------- */
  function defaults() {
    return {
      settings: { sound: true, shuffle: false, showBar: true, barText: 'Open 7 AM – 10 PM Daily · (703) 914-4600' },
      menu: { price: '$13.99', special: '', specialLabel: '특가', specialUntil: '', note: '매일 아침 7–10 AM', tagline: '한국인의 힘은 든든한 아침 짬밥에서' },
      schedule: {},
      items: [
        { id: uid(), type: 'menu', view: 'today', label: '오늘의 K-JjamBab', seconds: 15, from: '07:00', to: '10:00', screens: 'all', on: true },

    if (s.pts.length === 1) wctx.lineTo(s.pts[0][0] + 0.01, s.pts[0][1]);

      h += '<div class="drow' + (k === tkey ? ' today' : '') + '"><span class="dl">' + DAY_KO[d.getDay()] + '요일<small>' + md(d) + (k === tkey ? ' · 오늘' : '') + '</small></span>' +
        '<input type="text" data-day="' + k + '" data-k="main" placeholder="메인 (예: 불고기 백반)" value="' + esc(e.main) + '">' +
        '<input type="text" data-day="' + k + '" data-k="soup" placeholder="국" value="' + esc(e.soup) + '">' +
        '<input type="text" data-day="' + k + '" data-k="sides" placeholder="반찬" value="' + esc(e.sides) + '"></div>' +
        '<div class="drow en"><span></span>' +
        '<input type="text" data-day="' + k + '" data-k="mainEn" placeholder="Main in English (선택)" value="' + esc(e.mainEn) + '">' +
        '<input type="text" data-day="' + k + '" data-k="soupEn" placeholder="Soup" value="' + esc(e.soupEn) + '">' +
        '<input type="text" data-day="' + k + '" data-k="sidesEn" placeholder="Sides" value="' + esc(e.sidesEn) + '"></div>';
    }
    h += '</div><div class="addrow"><button id="btnCopyWeek">바로 앞 주 내용을 이 주로 복사</button><button class="danger" id="btnClearWeek">이 주 비우기</button></div>';
    return h;
  }

  function renderAdmin() {
    var s = state.settings, m = state.menu;
    var h = '<div class="wrap"><h1>아난골 디스플레이 관리자</h1>' +
      '<p class="help">여기서 바꾼 내용은 자동 저장되고, 매장의 보드와 TV에 1분 안에 반영됩니다. 위에서 아래 순서대로 반복 재생됩니다.</p>';

    h += '<h2>K-JjamBab 주간 스케줄</h2><p class="help">날짜별로 메뉴를 넣어 두면 "짬밥 메뉴" 항목이 오늘의 메뉴와 주간 메뉴표를 자동으로 보여줍니다.</p><div id="sched">' + schedHtml() + '</div>' +
      '<div class="grid" style="margin-top:6px"><label class="c3">정가<input type="text" data-menu="price" value="' + esc(m.price) + '"></label>' +
      '<label class="c3">특가 (비우면 정가만 표시)<input type="text" data-menu="special" placeholder="예: $12.99" value="' + esc(m.special) + '"></label>' +
      '<label class="c3">특가 문구<input type="text" data-menu="specialLabel" placeholder="예: 특가, Grand Opening" value="' + esc(m.specialLabel) + '"></label>' +
      '<label class="c3">특가 종료일 (지나면 자동으로 정가)<input type="date" data-menu="specialUntil" value="' + esc(m.specialUntil) + '"></label>' +
      '<label class="c4">안내 한 줄<input type="text" data-menu="note" value="' + esc(m.note) + '"></label>' +
      '<label class="c4" style="grid-column:span 8">문구<input type="text" data-menu="tagline" value="' + esc(m.tagline) + '"></label></div>';

    h += '<h2>재생 목록</h2><div class="addrow">' +
      '<button data-add="youtube">+ 유튜브 (영상 · 재생목록)</button><button data-add="music">+ 사이사이 음악 영상 (유튜브)</button><button data-add="image">+ 이미지 · 포스터</button>' +
      '<button data-add="video">+ 동영상 파일</button><button data-add="menu">+ 짬밥 메뉴</button><button data-add="text">+ 안내 문구</button></div><div id="items">';
    state.items.forEach(function (it, i) { h += itemCard(it, i); });
    h += '</div><p class="note">지금 시간대 재생 항목 — 보드(세로): ' + eligible('board').length + '개 · TV(가로): ' + eligible('tv').length + '개</p>';

    h += '<h2>화면 설정</h2>' +
      '<label class="chk"><input type="checkbox" data-set="sound"' + (s.sound ? ' checked' : '') + '> 영상 소리 켜기</label>' +
      '<label class="chk"><input type="checkbox" data-set="shuffle"' + (s.shuffle ? ' checked' : '') + '> 셔플 (재생 순서와 유튜브 영상 순서를 무작위로)</label>' +
      '<label class="chk"><input type="checkbox" data-set="showBar"' + (s.showBar ? ' checked' : '') + '> 하단 바 (매장명 · 안내 · 시계) 표시</label>' +
      '<div class="grid"><label class="c12">하단 바 안내 문구<input type="text" data-set="barText" value="' + esc(s.barText) + '"></label></div>';

    h += '</div><div id="savebar"><span id="saveMsg">' + esc(saveMsg) + '</span><button id="btnLogout">로그아웃</button><button class="primary" id="btnDone">닫기</button></div>';
    var top = adminEl.scrollTop;
    adminEl.innerHTML = h;
    adminEl.scrollTop = top;
  }

  function newItem(type) {
    var music = type === 'music'; if (music) type = 'youtube';
    var it = { id: uid(), type: type, label: music ? '음악 영상' : TYPE_NAME[type], from: '', to: '', screens: 'all', on: true };
    if (music) it.every = 3;
    if (type === 'youtube' || type === 'image' || type === 'video') it.src = '';
    if (type === 'image') it.seconds = 10;
    if (type === 'menu') { it.seconds = 15; it.view = 'today'; }
    if (type === 'text') { it.seconds = 12; it.title = '제목'; it.body = '내용을 입력하세요'; }
    return it;
  }
  function dropFile(it) { if (it.src && it.src.indexOf('up:') === 0) postJson('delete', { file: it.src.slice(3) }).catch(function () {}); }

  adminEl.addEventListener('click', function (e) {
    var t = e.target;
    if (t.id === 'btnBack' || t.id === 'btnDone') { if (t.id === 'btnDone') { clearTimeout(saveTimer); pushState(); } showStart(false); return; }
    if (t.id === 'btnLogout') { postJson('logout', {}).then(function () { showStart(false); }).catch(function () { showStart(false); }); return; }
    if (t.dataset.add) { state.items.push(newItem(t.dataset.add)); renderAdmin(); dirty(); return; }
    if (t.hasAttribute('data-yttest')) {
      var tc = t.closest('.card'), tm = tc.querySelector('[data-ytmsg]'), tb = tc.querySelector('[data-ytbox]');
      var ty = ytParse(state.items[+tc.dataset.i].src), say = function (cls, txt) { tm.className = cls; tm.textContent = txt; };
      if (!ty.list && !ty.videos.length) { say('warn', '먼저 유튜브 주소를 넣어 주세요.'); return; }
      tb.innerHTML = '<div></div>'; say('note', '불러오는 중…');
      loadYt().then(function (ok) {
        if (!ok) { say('warn', '유튜브에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }
        var played = false, vars = { autoplay: 1, mute: 1, controls: 1, playsinline: 1, origin: location.origin };
        var cfg = { width: 320, height: 180, playerVars: vars };
        if (ty.list) { vars.listType = 'playlist'; vars.list = ty.list; } else cfg.videoId = ty.videos[0];
        var tp, slow = setTimeout(function () { if (!played) say('warn', '재생이 시작되지 않았습니다. 주소가 완전한지, 재생목록이 "공개" 또는 "일부 공개"인지 확인해 주세요.'); }, 15000);
        cfg.events = {
          onReady: function (ev) { try { ev.target.mute(); ev.target.playVideo(); } catch (x) {} },
          onStateChange: function (ev) {
            if (ev.data !== 1 || played) return;
            played = true; clearTimeout(slow);
            var n = 0; try { n = (tp.getPlaylist() || []).length; } catch (x) {}
            say('note', '✔ 재생됩니다.' + (ty.list ? ' 재생목록 영상 ' + n + '개.' : ty.videos.length > 1 ? ' (첫 번째 영상으로 확인)' : ''));
          },
          onError: function (ev) {
            clearTimeout(slow);
            var c = ev.data;
            say('warn', (c === 101 || c === 150) ? '✘ 이 영상은 소유자가 다른 사이트에서의 재생을 막아 두었습니다. 공식 뮤직비디오에 흔합니다. 다른 영상을 써 주세요. (오류 ' + c + ')'
              : c === 100 ? '✘ 영상을 찾을 수 없거나 비공개입니다. (오류 100)'
              : c === 2 ? '✘ 주소가 올바르지 않습니다. 주소 전체를 다시 복사해 주세요. (오류 2)'
              : '✘ 재생할 수 없습니다. (오류 ' + c + ')');
          }
        };
        tp = new YT.Player(tb.firstChild, cfg);
      });
      return;
    }
    if (t.hasAttribute('data-ytadd') || t.dataset.ytdel) {
      var ci = +t.closest('.card').dataset.i, yi = state.items[ci], ls = String(yi.src || '').split('\n');
      if (t.dataset.ytdel) ls.splice(+t.dataset.ytdel, 1); else ls.push('');
      yi.src = ls.join('\n'); renderAdmin(); dirty();
      if (!t.dataset.ytdel) { var ins = adminEl.querySelectorAll('.card[data-i="' + ci + '"] [data-yt]'); if (ins.length) ins[ins.length - 1].focus(); }
      return;
    }
    if (t.dataset.wk) { schedWeek += +t.dataset.wk; document.getElementById('sched').innerHTML = schedHtml(); return; }
    if (t.dataset.wkset) { schedWeek = +t.dataset.wkset; document.getElementById('sched').innerHTML = schedHtml(); return; }
    if (t.id === 'btnCopyWeek' || t.id === 'btnClearWeek') {
      if (!t.dataset.sure) { t.dataset.sure = '1'; t.textContent = '한 번 더 누르면 실행합니다'; return; }
      var mon = addDays(mondayOf(new Date()), schedWeek * 7);
      for (var i = 0; i < 7; i++) {
        var k = ymd(addDays(mon, i)), p = state.schedule[ymd(addDays(mon, i - 7))];
        if (t.id === 'btnCopyWeek' && p) state.schedule[k] = JSON.parse(JSON.stringify(p));
        else delete state.schedule[k];
      }
      document.getElementById('sched').innerHTML = schedHtml(); dirty(); return;
    }
    if (t.dataset.act) {
      var idx = +t.closest('.card').dataset.i, it = state.items[idx], a = t.dataset.act;
      if (a === 'up' && idx > 0) state.items.splice(idx - 1, 0, state.items.splice(idx, 1)[0]);
      if (a === 'down' && idx < state.items.length - 1) state.items.splice(idx + 1, 0, state.items.splice(idx, 1)[0]);
      if (a === 'toggle') it.on = !it.on;
      if (a === 'del') {
        if (!t.dataset.sure) { t.dataset.sure = '1'; t.textContent = '한 번 더 누르면 삭제'; return; }
        dropFile(it); state.items.splice(idx, 1);
      }
      renderAdmin(); dirty();
    }
  });

  adminEl.addEventListener('input', function (e) {
    var t = e.target;
    if (t.dataset.yt) {
      var yc = t.closest('.card'), yit = state.items[+yc.dataset.i], yl = String(yit.src || '').split('\n');
      yl[+t.dataset.yt] = t.value.trim(); yit.src = yl.join('\n');
      var hint = yc.querySelector('[data-ythint]'); if (hint) hint.innerHTML = ytHint(yit);
    } else if (t.dataset.f) {
      var it = state.items[+t.closest('.card').dataset.i];
      if (t.dataset.f === 'src' && it.src && it.src.indexOf('up:') === 0 && !t.value) return;
      if (t.dataset.f === 'src' && it.src && it.src.indexOf('up:') === 0) { dropFile(it); delete it.fileName; }
      it[t.dataset.f] = t.type === 'number' ? (parseFloat(t.value) || '') : t.value;
    } else if (t.dataset.day) {
      var e2 = state.schedule[t.dataset.day] || (state.schedule[t.dataset.day] = { main: '', soup: '', sides: '' });
      e2[t.dataset.k] = t.value;
    } else if (t.dataset.menu) { state.menu[t.dataset.menu] = t.value; }
    else if (t.dataset.set && t.type !== 'checkbox') { state.settings[t.dataset.set] = t.value; }
    else return;
    dirty();
  });

  adminEl.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.set && t.type === 'checkbox') { state.settings[t.dataset.set] = t.checked; dirty(); return; }
    if (t.hasAttribute('data-builtin')) {
      var bi = BUILTIN[+t.value], bit = state.items[+t.closest('.card').dataset.i];
      if (t.value === '' || !bi) return;
      dropFile(bit); delete bit.fileName;
      bit.src = bi[0]; bit.label = bi[1]; bit.screens = bi[2];
      renderAdmin(); dirty(); return;
    }
    if (t.tagName === 'SELECT' && t.dataset.f) { renderAdmin(); return; }
    if (t.hasAttribute('data-file') && t.files && t.files[0]) {
      var card = t.closest('.card'), it = state.items[+card.dataset.i], f = t.files[0], msg = card.querySelector('[data-upmsg]');
      var fd = new FormData(); fd.append('file', f);
      var x = new XMLHttpRequest();
      x.open('POST', API + '?a=upload'); x.withCredentials = true;
      x.upload.onprogress = function (ev) { if (ev.lengthComputable && msg) msg.textContent = '올리는 중… ' + Math.round(ev.loaded / ev.total * 100) + '%'; };
      x.onerror = function () { if (msg) { msg.className = 'c6 warn'; msg.textContent = '올리지 못했습니다. 인터넷 연결을 확인해 주세요.'; } };
      x.onload = function () {
        var r = {}; try { r = JSON.parse(x.responseText); } catch (er) {}
        if (x.status === 401) { renderLogin('로그인이 만료되었습니다. 다시 로그인해 주세요.'); return; }
        if (x.status !== 200 || !r.ok) {
          var why = r.error === 'too_large' ? '파일이 너무 큽니다' + (r.limit ? ' (서버 한도 ' + r.limit + ')' : '') + '. 큰 영상은 유튜브에 올려 주소로 넣어 주세요.'
            : r.error === 'type' ? '올릴 수 없는 파일 형식입니다.' : '올리지 못했습니다.';
          if (x.status === 413) why = '파일이 너무 큽니다. 큰 영상은 유튜브에 올려 주소로 넣어 주세요.';
          if (msg) { msg.className = 'c6 warn'; msg.textContent = why; }
          return;
        }
        dropFile(it);
        it.src = 'up:' + r.file; it.fileName = r.name;
        if (!it.label || it.label === TYPE_NAME[it.type]) it.label = r.name;
        renderAdmin(); pushState();
      };
      x.send(fd);
    }
  });

  /* ---------- 시작 ---------- */
  layout(); applyChrome(); paintDev();
  var wantsAdmin = /(^|[?&])admin\b/.test(location.search) || location.hash === '#admin';
  pull().then(function () { if (wantsAdmin) openAdmin(); else showStart(true); });
})();
</script>
</body>
</html>
